  - id: sklearn-4
    title: "ColumnTransformer: Zahlen und Kategorien"
    vocab: [ColumnTransformer, OneHotEncoder, SimpleImputer, handle_unknown]
    intro: |
      Echte Tabellen mischen **Zahlen** (Alter, Einkommen) und **Kategorien** (Stadt, Geschlecht), oft mit Lücken.
      Mit dem `ColumnTransformer` bekommt jede Spaltengruppe ihre eigene Vorverarbeitung:

      ```python
      pre = ColumnTransformer([
          ("num", StandardScaler(), ["alter", "einkommen"]),
          ("cat", OneHotEncoder(handle_unknown="ignore"), ["stadt"]),
      ])
      ```

      Und weil das wieder ein Transformer ist, kommt er als Schritt in eine Pipeline. Pipelines lassen sich **verschachteln**.
    exercises:
      - type: info
        text: "So sieht das mit einem kleinen pandas-DataFrame aus:"
        code: |
          import pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.preprocessing import StandardScaler, OneHotEncoder

          df = pd.DataFrame({
              "alter": [25, 40, 33, 51],
              "einkommen": [2800, 4200, 3500, 5100],
              "stadt": ["Berlin", "Köln", "Berlin", "Wien"],
          })
          pre = ColumnTransformer([
              ("num", StandardScaler(), ["alter", "einkommen"]),
              ("cat", OneHotEncoder(handle_unknown="ignore"), ["stadt"]),
          ])
          out = pre.fit_transform(df)
          print(out.shape)
          print(pre.get_feature_names_out())
        run: true

      - type: mc
        question: "Was macht der `OneHotEncoder` aus der Spalte `stadt` mit den Werten Berlin, Köln, Wien?"
        options:
          - "Drei 0/1-Spalten, eine pro Stadt"
          - "Eine Spalte mit den Zahlen 0, 1, 2"
          - "Er löscht die Spalte"
          - "Er sortiert die Städte alphabetisch"
        answer: 0
        explain: "One-Hot = für jede Kategorie eine eigene Spalte mit 1 (trifft zu) oder 0. So denkt das Modell nicht, Wien wäre „größer“ als Berlin."

      - type: cloze
        code: |
          pre = ColumnTransformer([
              ("num", ___, ["alter", "einkommen"]),
              ("cat", OneHotEncoder(handle_unknown="___"), ["stadt"]),
          ])
        answers: ["StandardScaler()", "ignore"]
        distractors: ["OneHotEncoder()", "error", "drop"]

      - type: predict
        question: "Der Datensatz hat 2 Zahlen-Spalten und eine Spalte `stadt` mit 3 verschiedenen Städten. Wie viele Spalten hat das Ergebnis des ColumnTransformers oben?"
        code: |
          print(pre.fit_transform(df).shape[1])
        options: ["5", "3", "6", "2"]
        answer: 0
        explain: "2 skalierte Zahlen-Spalten + 3 One-Hot-Spalten = 5."

      - type: mc
        question: "Wozu dient `handle_unknown=\"ignore\"`?"
        options:
          - "Kommt bei der Vorhersage eine unbekannte Kategorie (z. B. eine neue Stadt), gibt es keinen Fehler, sondern nur Nullen"
          - "Fehlende Werte werden ignoriert"
          - "Die Spalte wird beim Training ignoriert"
          - "Warnungen werden unterdrückt"
        answer: 0

      - type: parsons
        question: "Verschachtelte Pipeline: Zahlen erst auffüllen, dann skalieren; Kategorien one-hot-kodieren; zum Schluss das Modell."
        code: |
          num_pipe = Pipeline([
              ("imputer", SimpleImputer(strategy="median")),
              ("scaler", StandardScaler()),
          ])
          pre = ColumnTransformer([
              ("num", num_pipe, num_cols),
              ("cat", OneHotEncoder(handle_unknown="ignore"), cat_cols),
          ])
          modell = Pipeline([("pre", pre), ("clf", LogisticRegression())])
        explain: "Von innen nach außen: kleine Pipeline für Zahlen → ColumnTransformer → große Pipeline mit Modell."

      - type: vocab
        id: SimpleImputer

      - type: code
        question: |
          Baue eine Pipeline `modell` mit den Schritten `"pre"` (ColumnTransformer) und `"clf"` (`LogisticRegression()`).
          Im ColumnTransformer: `"num"` = Imputer (Median) + Scaler für `num_cols`, `"cat"` = OneHotEncoder (`handle_unknown="ignore"`) für `cat_cols`.
          Fitte `modell` auf `df[num_cols + cat_cols]` und `df["kauft"]`.
        starter: |
          import numpy as np
          import pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.impute import SimpleImputer
          from sklearn.preprocessing import StandardScaler, OneHotEncoder
          from sklearn.linear_model import LogisticRegression

          df = pd.DataFrame({
              "alter":     [25, 40, np.nan, 51, 29, 62, 35, 44],
              "einkommen": [2800, 4200, 3500, np.nan, 3000, 5200, 3900, 4100],
              "stadt":     ["Berlin", "Köln", "Berlin", "Wien", "Köln", "Wien", "Berlin", "Köln"],
              "kauft":     [0, 1, 0, 1, 0, 1, 1, 1],
          })
          num_cols = ["alter", "einkommen"]
          cat_cols = ["stadt"]

          # dein Code

          print(modell.predict(df[num_cols + cat_cols]))
        solution: |
          import numpy as np
          import pandas as pd
          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.impute import SimpleImputer
          from sklearn.preprocessing import StandardScaler, OneHotEncoder
          from sklearn.linear_model import LogisticRegression

          df = pd.DataFrame({
              "alter":     [25, 40, np.nan, 51, 29, 62, 35, 44],
              "einkommen": [2800, 4200, 3500, np.nan, 3000, 5200, 3900, 4100],
              "stadt":     ["Berlin", "Köln", "Berlin", "Wien", "Köln", "Wien", "Berlin", "Köln"],
              "kauft":     [0, 1, 0, 1, 0, 1, 1, 1],
          })
          num_cols = ["alter", "einkommen"]
          cat_cols = ["stadt"]

          num_pipe = Pipeline([
              ("imputer", SimpleImputer(strategy="median")),
              ("scaler", StandardScaler()),
          ])
          pre = ColumnTransformer([
              ("num", num_pipe, num_cols),
              ("cat", OneHotEncoder(handle_unknown="ignore"), cat_cols),
          ])
          modell = Pipeline([("pre", pre), ("clf", LogisticRegression())])
          modell.fit(df[num_cols + cat_cols], df["kauft"])

          print(modell.predict(df[num_cols + cat_cols]))
        hint: "Nimm das Code-Puzzle von eben als Vorlage und ergänze am Ende `modell.fit(df[num_cols + cat_cols], df[\"kauft\"])`."
        tests: |
          assert list(modell.named_steps) == ["pre", "clf"], f"Schritte sollten ['pre', 'clf'] heißen, sind {list(modell.named_steps)}"
          namen = [t[0] for t in modell["pre"].transformers]
          assert "num" in namen and "cat" in namen, f"ColumnTransformer sollte 'num' und 'cat' haben, hat {namen}"
          neu = pd.DataFrame({"alter": [30], "einkommen": [np.nan], "stadt": ["Hamburg"]})
          assert len(modell.predict(neu)) == 1, "Vorhersage für neue Daten klappt nicht"

