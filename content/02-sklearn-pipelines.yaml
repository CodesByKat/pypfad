              return train_test_split(X, y, test_size=TEST_SIZE, random_state=SEED, stratify=y)

          X_train, X_test, y_train, y_test = lade_daten()

          # 1. Pipeline

          # 2. + 3. GridSearch

          # 4. Test-Genauigkeit
        solution: |
          from sklearn.datasets import load_wine
          from sklearn.model_selection import train_test_split, GridSearchCV
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.neighbors import KNeighborsClassifier

          TEST_SIZE = 0.25
          SEED = 42

          def lade_daten():
              X, y = load_wine(return_X_y=True)
              return train_test_split(X, y, test_size=TEST_SIZE, random_state=SEED, stratify=y)

          X_train, X_test, y_train, y_test = lade_daten()

          pipe = Pipeline([
              ("scaler", StandardScaler()),
              ("knn", KNeighborsClassifier()),
          ])
          param_grid = {
              "knn__n_neighbors": [1, 3, 5, 7, 9],
              "knn__weights": ["uniform", "distance"],
          }
          suche = GridSearchCV(pipe, param_grid, cv=5)
          suche.fit(X_train, y_train)
          print("Beste Parameter:", suche.best_params_)
          print("CV-Score:", round(suche.best_score_, 3))

          test_acc = suche.score(X_test, y_test)
          print("Test-Genauigkeit:", round(test_acc, 3))
        hint: |
          `param_grid = {"knn__n_neighbors": [...], "knn__weights": [...]}`
          `suche = GridSearchCV(pipe, param_grid, cv=5)` → `suche.fit(X_train, y_train)` → `test_acc = suche.score(X_test, y_test)`
        tests: |
          from sklearn.model_selection import GridSearchCV as _G
          assert isinstance(suche, _G), "suche sollte ein GridSearchCV-Objekt sein"
          assert set(suche.param_grid) == {"knn__n_neighbors", "knn__weights"}, f"param_grid-Schlüssel: {set(suche.param_grid)}. Zwei Unterstriche?"
          assert hasattr(suche, "best_params_"), "suche wurde noch nicht gefittet"
          assert list(suche.best_estimator_.named_steps) == ["scaler", "knn"], "Pipeline-Schritte sollten 'scaler' und 'knn' heißen"
          assert suche.cv == 5, "cv=5 setzen"
          assert test_acc > 0.85, f"test_acc = {test_acc}"
