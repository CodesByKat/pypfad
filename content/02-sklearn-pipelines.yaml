  - id: sklearn-5
    title: "Projekt: Cross-Validation & GridSearch"
    project: true
    vocab: [cross_val_score, GridSearchCV, param-grid-names, best_params_, best_estimator_]
    intro: |
      Statt nur einmal zu splitten, teilt **Cross-Validation** die Trainingsdaten in z. B. 5 Teile (Folds): 5-mal trainieren, jedes Mal ein anderer Teil zum Validieren.

      **GridSearchCV** probiert damit alle Parameter-Kombinationen durch, also genau die verschachtelte Schleife aus der Skript-Welt, nur automatisch.
      Parameter von Pipeline-Schritten sprichst du mit **zwei Unterstrichen** an: `schrittname__parameter`, z. B. `knn__n_neighbors`.
    exercises:
      - type: info
        code: |
          from sklearn.datasets import load_iris
          from sklearn.model_selection import cross_val_score
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.neighbors import KNeighborsClassifier

          X, y = load_iris(return_X_y=True)
          pipe = Pipeline([("scaler", StandardScaler()), ("knn", KNeighborsClassifier())])

          scores = cross_val_score(pipe, X, y, cv=5)
          print(scores.round(3))
          print("Mittel:", scores.mean().round(3))
        text: "`cross_val_score` liefert einen Score pro Fold. Der Mittelwert ist robuster als ein einzelner Split."
        run: true

      - type: mc
        question: "Was bedeutet `cv=5`?"
        options:
          - "Die Daten werden in 5 Teile geteilt; 5-mal wird auf 4 Teilen trainiert und auf dem 5. bewertet"
          - "Das Modell wird 5 Sekunden trainiert"
          - "5 % der Daten werden zum Testen benutzt"
          - "Es werden 5 verschiedene Modelle verglichen"
        answer: 0

      - type: cloze
        question: "Durchsuche `n_neighbors` des Pipeline-Schritts `\"knn\"` und gib die beste Kombination aus."
        code: |
          param_grid = {
              "___": [1, 3, 5, 7],
              "knn__weights": ["uniform", "distance"],
          }
          suche = GridSearchCV(pipe, param_grid, cv=5)
          suche.fit(X_train, y_train)
          print(suche.___)
        answers: ["knn__n_neighbors", "best_params_"]
        distractors: ["n_neighbors", "knn_n_neighbors", "best_score", "best_params"]
        explain: "Schrittname + **zwei** Unterstriche + Parametername. Ergebnisse von `fit` enden mit `_`: `best_params_`, `best_score_`, `best_estimator_`."

      - type: mc
        question: "Das Grid hat 4 × 2 = 8 Kombinationen, `cv=5`. Wie viele Trainingsläufe macht die Suche (ohne das finale Refit)?"
        options: ["40", "8", "13", "5"]
        answer: 0
        explain: "Jede der 8 Kombinationen wird 5-mal trainiert: 8 × 5 = 40. Danach wird das beste Modell einmal auf allen Trainingsdaten neu trainiert (Refit)."

      - type: free
        question: "Nach der GridSearch kennst du `best_score_`. Warum bewertest du das beste Modell trotzdem noch einmal auf dem **Test-Set**?"
        solution: |
          `best_score_` ist der beste Cross-Validation-Score unter vielen ausprobierten Kombinationen. Weil wir genau die Kombination **ausgewählt** haben, die auf diesen Folds am besten aussah, ist der Wert leicht zu optimistisch.
          Das Test-Set war an der Auswahl nicht beteiligt und liefert deshalb eine **ehrliche** Schätzung für neue Daten.

      - type: vocab
        id: param-grid-names

      - type: code
        question: |
          **Projekt:** Finde die beste KNN-Pipeline für den Wein-Datensatz.

          1. Pipeline `pipe` mit `"scaler"` (StandardScaler) und `"knn"` (KNeighborsClassifier)
          2. `GridSearchCV` als `suche` über `n_neighbors` = 1, 3, 5, 7, 9 und `weights` = `"uniform"`, `"distance"`, `cv=5`
          3. Auf den Trainingsdaten fitten, beste Parameter ausgeben
          4. Test-Genauigkeit in `test_acc` speichern
